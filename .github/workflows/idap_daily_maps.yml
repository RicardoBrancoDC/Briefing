name: IDAP Daily Maps + Pages

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Criar pastas necessárias
        run: |
          mkdir -p \
            .cache \
            out \
            site/imagens \
            site/data \
            site/assets \
            site/assets/flags/municipios \
            site/assets/flags/estados

          [ -f .cache/state.json ] || echo "{}" > .cache/state.json
          [ -f .cache/historico_alertas.json ] || echo "[]" > .cache/historico_alertas.json

      - name: Verificar variáveis do Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN está vazio"
          else
            echo "TELEGRAM_BOT_TOKEN ok"
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_CHAT_ID está vazio"
          else
            echo "TELEGRAM_CHAT_ID ok"
          fi

      - name: Diagnosticar acesso ao RSS da IDAP
        id: diagnostico_rss
        continue-on-error: true
        run: |
          RSS_URL="https://idapfile.mdr.gov.br/idap/api/rss/cap"

          echo "Data e hora UTC:"
          date -u

          echo
          echo "IP público do runner:"
          curl \
            --silent \
            --show-error \
            --max-time 15 \
            https://api.ipify.org || true

          echo
          echo
          echo "Resolução DNS:"
          getent hosts idapfile.mdr.gov.br || true

          echo
          echo "Teste HTTPS com curl:"
          curl \
            --verbose \
            --http1.1 \
            --location \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36" \
            --header "Accept: application/xml,text/xml,application/rss+xml,*/*;q=0.8" \
            --header "Accept-Language: pt-BR,pt;q=0.9,en;q=0.8" \
            --header "Accept-Encoding: identity" \
            --header "Cache-Control: no-cache" \
            --header "Connection: close" \
            --output /tmp/idap_rss.xml \
            --write-out "\nHTTP_CODE=%{http_code}\nCONTENT_TYPE=%{content_type}\nSIZE=%{size_download}\nREMOTE_IP=%{remote_ip}\nTOTAL_TIME=%{time_total}\n" \
            "$RSS_URL"

          echo
          echo "Arquivo recebido:"
          ls -lh /tmp/idap_rss.xml || true

          echo
          echo "Início do conteúdo:"
          head -c 500 /tmp/idap_rss.xml || true
          echo

      - name: Run daily maps
        env:
          TZ: "America/Sao_Paulo"
          RSS_URL: "https://idapfile.mdr.gov.br/idap/api/rss/cap"
          UF_GEOJSON_PATH: "resources/br_uf.geojson"
          LOGO_PATH: "resources/marca_sedec.png"
          OUT_DIR: "out"
          STATE_PATH: ".cache/state.json"
          HISTORY_PATH: ".cache/historico_alertas.json"
          WINDOW_HOURS: "24"
          RETENTION_HOURS: "72"
          MAX_ITEMS: ""
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail

          MAX_TENTATIVAS=3
          TENTATIVA=1

          while [ "$TENTATIVA" -le "$MAX_TENTATIVAS" ]; do
            echo "Executando o script. Tentativa $TENTATIVA de $MAX_TENTATIVAS."

            if python scripts/idap_daily_maps.py; then
              echo "Script executado com sucesso."
              exit 0
            fi

            if [ "$TENTATIVA" -lt "$MAX_TENTATIVAS" ]; then
              ESPERA=$((TENTATIVA * 30))
              echo "Falha na tentativa $TENTATIVA."
              echo "Nova tentativa em $ESPERA segundos."
              sleep "$ESPERA"
            fi

            TENTATIVA=$((TENTATIVA + 1))
          done

          echo "::error::Não foi possível executar o script após $MAX_TENTATIVAS tentativas."
          exit 2

      - name: Localizar pasta mais recente de saída
        id: localizar_saida
        run: |
          ULTIMA_PASTA=$(find out -maxdepth 1 -type d -name "run_*" -print | sort -r | head -n 1)

          if [ -z "$ULTIMA_PASTA" ]; then
            echo "::error::Nenhuma pasta de saída foi encontrada em out/."
            exit 1
          fi

          echo "Pasta localizada: $ULTIMA_PASTA"
          echo "pasta_saida=$ULTIMA_PASTA" >> "$GITHUB_OUTPUT"

      - name: Copiar imagens geradas para o site
        run: |
          PASTA="${{ steps.localizar_saida.outputs.pasta_saida }}"

          if ! compgen -G "$PASTA/*.png" > /dev/null; then
            echo "::error::Nenhuma imagem PNG foi encontrada em $PASTA."
            exit 1
          fi

          cp -f "$PASTA"/*.png site/imagens/

      - name: Gerar arquivo de última atualização
        run: |
          python - << 'PY'
          import json
          from datetime import datetime, timezone

          dados = {
              "gerado_em": datetime.now(timezone.utc).isoformat()
          }

          with open(
              "site/ultima_atualizacao.json",
              "w",
              encoding="utf-8",
          ) as arquivo:
              json.dump(
                  dados,
                  arquivo,
                  ensure_ascii=False,
                  indent=2,
              )
          PY

      - name: Gerar dados do dashboard original
        env:
          OUT_DIR: "out"
          SITE_DIR: "site"
          UF_GEOJSON_PATH: "resources/br_uf.geojson"
          DASHBOARD_GEOJSON_TARGET: "site/data/br_uf.geojson"
        run: |
          python scripts/build_dashboard_data.py

      - name: Gerar dados do dashboard2
        env:
          HISTORY_PATH: ".cache/historico_alertas.json"
          SITE_DIR: "site"
          WINDOW_HOURS: "24"
          UF_GEOJSON_PATH: "resources/br_uf.geojson"
          DASHBOARD_GEOJSON_TARGET: "site/data/br_uf.geojson"
          FLAG_DOWNLOAD_ENABLED: "0"
        run: |
          python scripts/build_dash2.py

      - name: Validar arquivos mínimos do site
        run: |
          test -s site/index.html
          test -s site/dashboard.html
          test -s site/dashboard_data.json
          test -s site/dashboard_data2.json
          test -s site/ultima_atualizacao.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idap_daily_outputs
          path: |
            out/
            .cache/state.json
            .cache/historico_alertas.json
            site/dashboard_data.json
            site/dashboard_data2.json
            site/ultima_atualizacao.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload do artifact do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Commit history/state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .cache/state.json \
            .cache/historico_alertas.json \
            site/dashboard_data.json \
            site/dashboard_data2.json \
            site/data/br_uf.geojson \
            site/ultima_atualizacao.json \
            site/imagens/

          if git diff --cached --quiet; then
            echo "Sem alterações"
            exit 0
          fi

          git commit -m "Atualiza dashboards IDAP [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
